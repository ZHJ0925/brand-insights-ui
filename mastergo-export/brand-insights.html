<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f3f2" />
  <title>品牌洞察 · 登录</title>
  <style>
    :root { font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #161616; }
    * { box-sizing: border-box; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    html, body { width: 100%; min-width: 0; min-height: 100%; margin: 0; }
    body { min-height: 100dvh; overflow: hidden; background: #f7f3f2; }
    button, input { font: inherit; }

    .login-page { position: relative; isolation: isolate; width: 100vw; height: 100dvh; overflow: hidden; background: linear-gradient(90deg, #f7f2f2 0%, #f7f3f3 49%, #f9f7f8 100%); }
    .scene { position: absolute; z-index: 0; inset: 0; overflow: hidden; background: linear-gradient(90deg, #f7f2f2 0%, #f7f3f3 49%, #f9f7f8 100%); }
    .scene img { position: absolute; left: 0; top: clamp(36px, 6.25vh, 50px); width: 100%; height: calc(100% - clamp(36px, 6.25vh, 50px)); object-fit: cover; object-position: center center; }

    .header { position: absolute; left: 60px; top: 40px; z-index: 2; display: flex; align-items: flex-start; width: auto; height: 40px; padding: 0; }
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-symbol { display: block; flex: none; width: 44px; height: 40px; object-fit: contain; }
    .brand-wordmark { display: block; flex: none; width: 124.79px; height: 30px; object-fit: contain; }

    .login-wrap { position: absolute; z-index: 1; right: 120px; top: 50%; width: 287.04px; height: 409.76px; padding: 0; transform: translateY(-50%); }
    .login-card { width: 100%; height: 409.76px; min-width: 0; padding: 20.48px 30.72px; background: #fff; border: .64px solid #fff; border-radius: 8px; box-shadow: 8px 13px 19px rgba(0,0,0,.10); }
    .greeting { margin: 0 0 20.48px; font-size: 15.36px; font-weight: 500; line-height: 22px; }
    .tabs { position: relative; display: grid; width: 225.6px; height: 23.2px; grid-template-columns: 1fr 1fr; }
    .tabs::after { content: ""; position: absolute; left: 0; bottom: 0; width: 225.6px; height: .8px; background: url("./asset/icons/svg_1dd9d752.svg") left top / 225.6px .8px no-repeat; }
    .tabs.is-qr::after { background: linear-gradient(90deg, #e60000 0 50%, rgba(0,0,0,.25) 50% 100%); }
    .tab { position: relative; z-index: 1; padding: 0 0 6.56px; border: 0; background: transparent; color: rgba(0,0,0,.8); cursor: pointer; font-size: 11.52px; font-weight: 400; line-height: 16.64px; transition: color .2s ease; }
    .tab.is-active { color: #000; font-weight: 400; }
    .tab.is-active::after { display: none; }
    .tab:focus { outline: none; }
    .panel { display: none; padding-top: 15.36px; }
    .panel.is-active { display: block; }
    .field { position: relative; display: block; margin-bottom: 15.36px; }
    .field input { display: block; width: 225.28px; height: 34.56px; padding: 0 10.24px; border: .64px solid #dcdcdc; border-radius: 2.56px; outline: 0; color: #161616; background: #fff; font-size: 8.96px; line-height: 13px; transition: border-color .2s ease, box-shadow .2s ease; }
    .field input:focus { border-color: #e60000; box-shadow: 0 0 0 3px rgba(230,0,0,.09); }
    .password-input { padding-right: 32px !important; }
    .password-toggle { position: absolute; top: 50%; right: 10.24px; display: grid; width: 12.8px; height: 12.8px; padding: 0; border: 0; place-items: center; background: transparent; cursor: pointer; transform: translateY(-50%); }
    .password-toggle img { width: 12.8px; height: 12.8px; opacity: .72; }
    .forgot-row { display: flex; justify-content: flex-end; width: 225.28px; margin: -2.56px 0 12.8px; }
    .forgot-link { border: 0; padding: 0; background: transparent; color: #000; cursor: pointer; font-size: 7.68px; line-height: 12.8px; }
    .primary-button, .sso-button { width: 225.28px; height: 34.56px; border-radius: 2.56px; cursor: pointer; font-size: 12.8px; line-height: 18px; }
    .primary-button { margin-top: 0; border: .64px solid #e60000; background: #e60000; color: #fff; font-weight: 500; transition: background .2s ease, transform .2s ease; }
    .primary-button:hover { background: #c90000; }
    .primary-button:active { transform: translateY(1px); }
    .sso-button { margin-top: 20.48px; border: 1px solid #bfbfbf; background: #fff; color: #000; font-weight: 400; }
    .agreement { display: flex; align-items: center; justify-content: center; gap: 5.12px; margin-top: 12.8px; color: rgba(0,0,0,.8); font-size: 10.24px; line-height: 14px; cursor: pointer; }
    .agreement input { position: absolute; width: 1px; height: 1px; margin: -1px; opacity: 0; }
    .agreement-checkbox { width: 10.24px; height: 10.24px; flex: none; box-sizing: border-box; border: .65px solid #dcdcdc; border-radius: 1.95px; background: #fff; }
    .agreement input:checked + .agreement-checkbox { border-color: #e60000; background: #e60000; }
    .agreement input:checked + .agreement-checkbox::after { content: ''; display: block; width: 4px; height: 2px; margin: 2.5px 0 0 2px; border: solid #fff; border-width: 0 0 1px 1px; transform: rotate(-45deg); }
    .agreement input:focus-visible + .agreement-checkbox { outline: 1px solid #e60000; outline-offset: 2px; }
    .agreement a { color: #000; text-decoration: none; }
    .agreement a:hover { text-decoration: underline; }
    .qr-panel { text-align: center; }
    .qr-placeholder { width: 225.28px; height: 118px; margin: 0 auto; border: .64px solid #dcdcdc; border-radius: 2.56px; background: #fff; }
    .qr-panel p { margin: 10px 0 0; color: rgba(0,0,0,.56); font-size: 10.24px; line-height: 14px; }

    @media (max-width: 640px) {
      .login-wrap { right: auto; left: 50%; transform: translate(-50%, -50%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .tab, .field input, .primary-button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <div class="scene" aria-hidden="true"><img src="./asset/images/3616d8ddddce1791370f75b0e88a9e00.png" alt="" /></div>
    <header class="header"><a class="brand" href="#" aria-label="品牌洞察首页"><img class="brand-symbol" src="./asset/icons/svg_0889150a.svg" alt="" /><img class="brand-wordmark" src="./asset/icons/svg_74a58cf4.svg" alt="品牌洞察" /></a></header>
    <section class="login-wrap" aria-label="登录">
      <div class="login-card">
          <h1 class="greeting">Hi，欢迎登录</h1>
          <div class="tabs is-account" role="tablist" aria-label="登录方式">
            <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="qr-panel" id="qr-tab">扫码登录</button>
            <button class="tab is-active" type="button" role="tab" aria-selected="true" aria-controls="account-panel" id="account-tab">账号密码登录</button>
          </div>
          <div class="panel qr-panel" role="tabpanel" id="qr-panel" aria-labelledby="qr-tab"><div class="qr-placeholder" aria-label="登录二维码"></div><p>请使用品牌洞察 App 扫码登录</p></div>
          <form class="panel is-active" role="tabpanel" id="account-panel" aria-labelledby="account-tab">
            <label class="field"><span class="sr-only">账号</span><input autocomplete="username" name="account" placeholder="请输入账号" required /></label>
            <label class="field"><span class="sr-only">密码</span><input class="password-input" autocomplete="current-password" name="password" placeholder="请输入密码" type="password" required /><button class="password-toggle" type="button" aria-label="显示密码"><img src="./asset/icons/svg_9e4a20d3.svg" alt="" /></button></label>
            <label class="field"><span class="sr-only">图形验证码</span><input autocomplete="off" name="captcha" placeholder="请输入图形验证码" required /></label>
            <div class="forgot-row"><button class="forgot-link" type="button">重置密码</button></div>
            <button class="primary-button" type="submit">登录</button>
            <button class="sso-button" type="button">sso一键登录</button>
            <label class="agreement"><input type="checkbox" required /><span class="agreement-checkbox" aria-hidden="true"></span><span>同意 <a href="#privacy">用户隐私政策</a></span></label>
          </form>
      </div>
    </section>
  </main>
  <script>
    const tabs = document.querySelectorAll('.tab');
    const panels = document.querySelectorAll('.panel');
    tabs.forEach(tab => tab.addEventListener('click', () => {
      const panelId = tab.getAttribute('aria-controls');
      tabs.forEach(item => { const active = item === tab; item.classList.toggle('is-active', active); item.setAttribute('aria-selected', active); });
      panels.forEach(panel => panel.classList.toggle('is-active', panel.id === panelId));
      document.querySelector('.tabs').classList.toggle('is-qr', panelId === 'qr-panel');
    }));
    const password = document.querySelector('.password-input');
    const toggle = document.querySelector('.password-toggle');
    toggle.addEventListener('click', () => { const hidden = password.type === 'password'; password.type = hidden ? 'text' : 'password'; toggle.setAttribute('aria-label', hidden ? '隐藏密码' : '显示密码'); });
    document.querySelector('form').addEventListener('submit', event => {
      event.preventDefault();
      window.location.href = '../index.html';
    });
  </script>
</body>
</html>
