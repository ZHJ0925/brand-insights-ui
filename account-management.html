ow-actions"><button data-toast="编辑账号">编辑</button><button data-toast="已发送重置密码链接">重置密码</button><button data-toast="账号状态已更新">冻结账号</button><button data-toast="账号已删除">删除</button></div></td></tr>`).join('');let timer;const showToast=text=>{toastEl.textContent=text;toastEl.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toastEl.classList.remove('show'),1400)};const openModal=id=>{const modal=document.getElementById(id);modal.classList.add('open');modal.setAttribute('aria-hidden','false')};const closeModal=id=>{const modal=document.getElementById(id);modal.classList.remove('open');modal.setAttribute('aria-hidden','true')};document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){closeModal(close.dataset.close);return}if(e.target.classList.contains('modal')){closeModal(e.target.id);return}if(e.target.dataset.toast){showToast(e.target.dataset.toast)}const recharge=e.target.closest('.recharge-link');if(recharge){document.getElementById('recharge-title').textContent='充值洞察豆 · '+recharge.dataset.name;document.querySelector('.balance-line b').textContent=recharge.dataset.balance||'3,500';openModal('recharge-modal')}});resetBtn.onclick=()=>document.querySelectorAll('.filter select').forEach(x=>x.selectedIndex=0);createBtn.onclick=()=>openModal('create-modal');document.getElementById('create-form').onsubmit=e=>{e.preventDefault();closeModal('create-modal');showToast('账号创建成功')};document.getElementById('recharge-form').onsubmit=e=>{e.preventDefault();closeModal('recharge-modal');showToast('充值成功')};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t)));document.querySelectorAll('.amount-grid').forEach(group=>group.addEventListener('click',e=>{if(!e.target.classList.contains('amount-btn'))return;group.querySelectorAll('.amount-btn').forEach(btn=>btn.classList.remove('active'));e.target.classList.add('active')}));})();</script><script src="nav-state.js">
