name: Undeploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare empty site
        run: |
          mkdir -p _site
          cat > _site/index.html << 'HTML'
          <!doctype html>
          <html lang="zh-CN"><head><meta charset="utf-8"><title>已下线</title></head>
          <body style="font-family:sans-serif;padding:48px;color:#444">此站点已取消部署。</body></html>
          HTML
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
