name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish directory
        run: |
          mkdir -p _site
          find . -mindepth 1 -maxdepth 1 \
            ! -name '_site' \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'figma-*' \
            ! -name 'template-create.backup-*' \
            -exec cp -a {} _site/ \;
          # Remove design reference images if copied by glob miss
          rm -f _site/figma-* _site/template-create.backup-* 2>/dev/null || true
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
