<script>
  const detailDialog = document.querySelector('#refresh-detail-dialog');
  const closeDetailDialog = () => { detailDialog.hidden = true; };
  const openDetailDialog = (id) => {
    const record = logs.find(item => item[0] === id);
    if (!record) return;
    const [recordId, refreshType, , createdAt, status, count, interactions, beans] = record;
    document.querySelector('#detail-title').textContent = `刷新记录详情-${recordId}`;
    const typeTag = document.querySelector('#detail-refresh-type');
    typeTag.textContent = refreshType;
    typeTag.className = `type-tag${refreshType === '手动刷新' ? ' manual' : ''}`;
    const statusTag = document.querySelector('#detail-status');
    statusTag.textContent = status;
    statusTag.className = `status ${status === '成功' ? 'ok' : 'fail'}`;
    document.querySelector('#detail-created-at').textContent = createdAt;
    document.querySelector('#detail-count').textContent = count;
    document.querySelector('#detail-interactions').textContent = `+${interactions}`;
    document.querySelector('#detail-beans').textContent = beans;
    detailDialog.hidden = false;
  };
  document.addEventListener('click', event => {
    const detailButton = event.target.closest('.detail-action');
    if (detailButton) openDetailDialog(detailButton.dataset.id);
    if (event.target === detailDialog || event.target.closest('[data-detail-close]')) closeDetailDialog();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !detailDialog.hidden) closeDetailDialog();
  });
  document.querySelector('#detail-export').addEventListener('click', () => {
    closeDetailDialog();
  });
</script>
<script>

    const isCollapsed = page.classList.toggle('collapsed');
    document.querySelector('.collapse').setAttribute('aria-label', isCollapsed ? '展开导航' : '收起导航');
  });
