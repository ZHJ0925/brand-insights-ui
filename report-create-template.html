<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>选择报告模板 - 传播洞察</title>
  <style>
    :root{--side:240px;--bg:#f2f3f4;--purple:#7a5cff;--ink:#1a1a1a;--line:#dcdcdc}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{min-width:1180px;background:var(--bg);color:var(--ink);font:12px/1.5 "PingFang SC","Microsoft YaHei",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.page{height:100vh;overflow:hidden;animation:pageIn .28s ease both}.page:before{content:"";position:fixed;z-index:0;left:var(--side);right:0;top:0;height:470px;background:url("assets/bg-figma.png") center top/cover no-repeat;opacity:.28;filter:blur(2px);pointer-events:none}.page:after{content:"";position:fixed;z-index:0;left:var(--side);right:0;top:26px;height:470px;background:linear-gradient(180deg,rgba(242,243,244,0),rgba(242,243,244,.68) 42%,#f2f3f4 91%);pointer-events:none}
    .sidebar{position:fixed;z-index:20;inset:0 auto 0 0;width:var(--side);height:100vh;overflow:hidden;border-right:1px solid rgba(202,205,211,.78);background:rgba(239,240,242,.82);transition:width .28s cubic-bezier(.2,.8,.2,1)}.brand{height:64px;position:relative;display:flex;align-items:center}.brand>img{width:239px;height:64px;display:block;object-fit:contain}.collapse{position:absolute;right:16px;top:22px;width:20px;height:20px;padding:0;border:0;background:transparent;color:#2f3237;display:grid;place-items:center}.collapse svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}.nav{height:calc(100vh - 186px);padding:16px 12px}.nav-group{margin-bottom:24px}.nav-title{height:24px;padding-left:16px;display:flex;align-items:center;color:#888;font-size:14px}.nav-link{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:48px;margin-top:8px;padding:0 16px;border:0;border-radius:10px;background:transparent;color:#333;font-size:15px;text-align:left;transition:background .18s ease}.nav-link:hover{background:rgba(255,255,255,.72)}.nav-link.active{height:50px;background:rgba(255,255,255,.9);font-weight:600;box-shadow:0 1px 8px rgba(63,14,0,.08)}.nav-link.active:before{content:"";position:absolute;left:0;top:15px;width:3px;height:20px;border-radius:0 2px 2px 0;background:#e60000}.nav-icon{width:20px;height:20px;object-fit:contain;flex:0 0 auto}.bean-card{position:absolute;left:12px;right:13px;bottom:24px;height:100px;padding:16px;border-radius:8px;background:url("assets/bean-bg.png") center/100% 100% no-repeat;overflow:hidden}.bean-card:after{content:"";position:absolute;left:16px;bottom:9px;width:182px;height:6px;border-radius:9px;background:linear-gradient(90deg,#ff2640 0 66%,transparent 66%),rgba(255,205,212,.58)}.bean-label{color:#666}.bean-number{margin-top:7px;font:500 22px/33px Arial}
    .header{position:relative;z-index:2;height:64px;margin-left:var(--side);padding:0 24px;display:flex;align-items:center;justify-content:space-between;transition:margin-left .28s ease}.crumbs{display:flex;gap:6px;align-items:center;color:#999;font-size:14px}.crumbs b{color:#333;font-weight:500}.tools{display:flex;gap:14px}.tool,.avatar{width:36px;height:36px;display:grid;place-items:center;border:1px solid #fff;border-radius:8px;background:rgba(255,255,255,.68)}.tool img{width:18px;height:18px}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:8px}
    .main{position:relative;z-index:2;height:calc(100vh - 64px);margin-left:var(--side);padding:20px 24px;overflow:auto;scrollbar-gutter:stable;transition:margin-left .28s ease}.top{height:30px;display:flex;align-items:center;justify-content:space-between}.title-wrap{display:flex;align-items:center;gap:12px}.back{height:30px;padding:0 12px 0 6px;display:flex;align-items:center;gap:2px;border:1px solid rgba(0,0,0,.1);border-radius:6px;background:#fff;color:#1a1a1a}.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}.top strong{font-size:18px;line-height:27px}.top-actions{display:flex;gap:8px}.draft,.prev,.next{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:#fff;color:#1a1a1a;white-space:nowrap}.next{border-color:#333;background:#333;color:#fff}.next:disabled{opacity:.4;cursor:not-allowed}
    .steps{height:64px;margin:16px 0 14px;display:flex;align-items:center}.step{min-width:151px;display:flex;align-items:center;gap:10px;padding:12px 16px}.num{width:24px;height:24px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;background:#dbdcde;color:#999;font-size:14px;font-weight:600}.step strong,.step span{display:block;white-space:nowrap}.step strong{color:#999;font-size:14px;line-height:20px;font-weight:500}.step span{margin-top:2px;color:#999}.step.done .num,.step.active .num{background:var(--purple);color:#fff}.step.done strong,.step.active strong{color:#1a1a1a}.step.active strong{color:var(--purple)}.line{height:1px;flex:1;min-width:40px;margin:0 8px;background:#d6d6d6}.line.done{background:var(--purple)}
    .template-panel{min-height:calc(100vh - 226px);padding:20px 16px;border:1px solid #f3f4f6;border-radius:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.04)}.panel-title{margin:0 0 16px;font-size:14px;line-height:21px;font-weight:600}.search-box{position:relative;display:block;align-self:flex-start;width:360px;height:28px;margin:0 0 16px;flex:0 0 28px}.search-box img{position:absolute;left:8px;top:6px;width:16px;height:16px;object-fit:contain;pointer-events:none}.search-box input{display:block;width:360px;height:28px;padding:0 8px 0 32px;border:1px solid #dcdcdc;border-radius:4px;outline:0;color:#333;font-size:12px;line-height:20px}.search-box input::placeholder{color:#999;opacity:1}.search-box input:focus{border-color:#242424}.template-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}.template-card{position:relative;min-height:104px;padding:17px;display:flex;align-items:flex-start;gap:12px;border:1px solid rgba(153,153,153,.2);border-radius:6px;background:#fff;text-align:left;transition:box-shadow .18s ease,transform .18s ease}.template-card:hover{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#ff7777,#ab9bfc) border-box;box-shadow:0 0 6px rgba(161,0,0,.1);transform:translateY(-1px)}.radio{position:relative;width:16px;height:16px;margin-top:3px;flex:0 0 auto;border:1px solid #d6d6d6;border-radius:50%;background:#fff}.template-card.selected .radio{border-color:#7a5cff}.template-card.selected .radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#7a5cff}.template-info{min-width:0;flex:1}.template-head{display:flex;align-items:center;gap:8px}.template-name{font-size:14px;line-height:20px;font-weight:600;white-space:nowrap}.badge{height:20px;padding:2px 10px;border:1px solid rgba(122,92,255,.25);border-radius:4px;background:#f7f5ff;color:#7a5cff;font-size:10px;line-height:15px}.badge.special{border-color:rgba(25,159,255,.2);background:#f1f9ff;color:#199fff}.template-desc{margin:4px 0 0;color:#666;font-size:12px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.template-meta{display:flex;align-items:center;gap:8px;margin-top:7px;color:#999;font-size:11px;line-height:17px}.template-meta i{width:1px;height:11px;background:#d9d9d9}.preview{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:4px 12px;flex:0 0 auto;border:1px solid #dcdcdc;border-radius:4px;background:#fff;color:#1a1a1a;font-size:12px;line-height:20px;white-space:nowrap}.empty{display:none;padding:80px 0;text-align:center;color:#999;grid-column:1/-1}.toast{position:fixed;z-index:100;left:50%;bottom:30px;padding:10px 16px;border-radius:6px;background:#333;color:#fff;opacity:0;transform:translate(-50%,12px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    .page.collapsed{--side:84px}.page.collapsed .sidebar{width:84px;overflow:visible}.page.collapsed .brand{justify-content:center}.page.collapsed .brand>img{content:url("assets/brand-logo-collapsed.svg");width:44px;height:40px}.page.collapsed .collapse{inset:0;width:84px;height:64px;opacity:0}.page.collapsed .nav{padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:24px}.page.collapsed .nav-group{width:50px;margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}.page.collapsed .nav-title{width:44px;padding:0;justify-content:center;font-size:0}.page.collapsed .nav-title:after{content:attr(data-short);font-size:14px}.page.collapsed .nav-link{width:50px;margin:0;padding:0;justify-content:center;gap:0}.page.collapsed .nav-link span{display:none}.page.collapsed .bean-card{left:7px;right:auto;width:70px;height:70px;padding:9px;background:#fff}.page.collapsed .bean-card:after{display:none}.page.collapsed .bean-label{font-size:0}.page.collapsed .bean-label:before{content:"洞察豆";font-size:12px}.page.collapsed .bean-number{margin-top:0;font-size:0}.page.collapsed .bean-number:before{content:"2,580";font-size:22px}.page.collapsed .header,.page.collapsed .main{margin-left:84px}@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:1400px){.steps{overflow:auto}.template-grid{gap:12px}.template-panel{min-height:600px}}
  </style>
</head>
<body>
  <div class="page">
    <aside class="sidebar"><div class="brand"><img src="assets/brand-logo-expanded.svg" alt="传播洞察"><button class="collapse" aria-label="折叠侧边栏"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div><nav class="nav"><section class="nav-group"><div class="nav-title" data-short="监测">监测模块</div><button class="nav-link" data-href="index.html"><img class="nav-icon" src="assets/report-nav-monitor.svg" alt=""><span>监测项目列表</span></button></section><section class="nav-group"><div class="nav-title" data-short="报告">智能报告</div><button class="nav-link active" data-href="report-management.html"><img class="nav-icon" src="assets/report-nav-report.svg" alt=""><span>报告管理</span></button><button class="nav-link" data-href="template.html"><img class="nav-icon" src="assets/report-nav-template.svg" alt=""><span>报告模板中心</span></button></section><section class="nav-group"><div class="nav-title" data-short="系统">系统管理</div><button class="nav-link"><img class="nav-icon" src="assets/report-nav-account.svg" alt=""><span>账号管理</span></button><button class="nav-link"><img class="nav-icon" src="assets/report-nav-article.svg" alt=""><span>刷新记录日志</span></button><button class="nav-link"><img class="nav-icon" src="assets/report-nav-reset.svg" alt=""><span>互动量刷新管理</span></button><button class="nav-link"><img class="nav-icon" src="assets/report-nav-category.svg" alt=""><span>分类设置</span></button></section></nav><div class="bean-card"><div class="bean-label">洞察豆余额</div><div class="bean-number">32,580</div></div></aside>
    <header class="header"><div class="crumbs"><span>智能报告</span><span>›</span><span>报告管理</span><span>›</span><b>新建报告</b></div><div class="tools"><button class="tool"><img src="assets/header-bell.svg" alt=""></button><button class="tool"><img src="assets/header-help.svg" alt=""></button><div class="avatar"><img src="assets/header-avatar.png" alt=""></div></div></header>
    <main class="main">
      <div class="top"><div class="title-wrap"><button class="back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>返回</button><strong>新建报告</strong></div><div class="top-actions"><button class="draft">保存草稿</button><button class="prev">上一步</button><button class="next">下一步</button></div></div>
      <section class="steps"><div class="step done"><b class="num">1</b><div><strong>选择报告类型</strong><span>专项/周期报告</span></div></div><i class="line done"></i><div class="step done"><b class="num">2</b><div><strong>填写基础信息</strong><span>设置名称时间</span></div></div><i class="line done"></i><div class="step active"><b class="num">3</b><div><strong>选择报告模板</strong><span>选择模板</span></div></div><i class="line"></i><div class="step"><b class="num">4</b><div><strong>确认数据源</strong><span>选定监测项目</span></div></div></section>
      <section class="template-panel"><h2 class="panel-title">选择报告模板</h2><label class="search-box"><img src="assets/report-template-search.svg" alt=""><input placeholder="搜索报告模板名称"></label><div class="template-grid" id="templateGrid"></div></section>
    </main>
    <div class="toast"></div>
  </div>
  <script>
    const templates=[
      ['品牌传播日报','日报','每日全面洞察，快速了解当日传播概况','periodic'],['品牌传播周报','周报','周期性内容分析，深入了解传播效果','periodic'],
      ['品牌传播月报','月报','月度变化分析，洞察深度传播趋势','periodic'],['微博专项报告','专项','聚焦微博平台，深入分析传播效果','special'],
      ['竞品对比报告','专项','对比分析品牌与竞品品牌优劣势','special'],['小红书专项报告','专项','聚焦小红书，分析种草内容传播效果','special'],
      ['抖音专项报告','专项','聚焦抖音声量，分析短视频传播效果','special'],['KOL传播报告','专项','聚焦KOL传播，分析关键意见领袖影响力','special'],
      ['事件传播报告','专项','追踪特定事件的传播路径，分析传播历程','special'],['季度总结报告','月报','季度数据沉淀，全面分析周期性传播趋势','periodic'],
      ['事件传播报告','专项','追踪特定事件的传播路径，分析传播历程','special'],['季度总结报告','月报','季度数据沉淀，全面分析周期性传播趋势','periodic']
    ];
    const grid=document.querySelector('#templateGrid'),toast=document.querySelector('.toast'),params=new URLSearchParams(location.search),type=params.get('type')||'special';let selected=0;
    function render(query=''){const list=templates.filter(item=>item[0].includes(query.trim()));grid.innerHTML=list.map((item,index)=>`<button class="template-card ${index===selected&&!query?'selected':''}" data-name="${item[0]}"><span class="radio"></span><span class="template-info"><span class="template-head"><span class="template-name">${item[0]}</span><span class="badge ${item[3]==='special'?'special':''}">${item[1]}</span></span><span class="template-desc">${item[2]}</span><span class="template-meta"><span>3个模板</span><i></i><span>4个分析维度</span></span></span><span class="preview">预览</span></button>`).join('')||'<div class="empty" style="display:block">未找到匹配模板</div>'}
    render();
    grid.addEventListener('click',event=>{const preview=event.target.closest('.preview'),card=event.target.closest('.template-card');if(!card)return;if(preview){event.stopPropagation();showToast(`正在预览「${card.dataset.name}」`);return}document.querySelectorAll('.template-card').forEach(item=>item.classList.toggle('selected',item===card));selected=[...grid.children].indexOf(card)});
    document.querySelector('.search-box input').addEventListener('input',event=>render(event.target.value));
    document.querySelector('.collapse').addEventListener('click',()=>document.querySelector('.page').classList.toggle('collapsed'));
    document.querySelectorAll('[data-href]').forEach(item=>item.addEventListener('click',()=>location.href=item.dataset.href));
    document.querySelector('.back').addEventListener('click',()=>location.href='report-management.html');
    document.querySelector('.prev').addEventListener('click',()=>location.href=`report-create-basic.html?type=${type}`);
    document.querySelector('.next').addEventListener('click',()=>{const selectedCard=document.querySelector('.template-card.selected');if(selectedCard)sessionStorage.setItem('reportTemplateName',selectedCard.dataset.name);location.href=`report-create-source.html?type=${type}`});
    function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),1600)}
  </script>
  <script src="nav-state.js"></script>
</body>
</html>
