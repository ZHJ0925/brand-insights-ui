  <style>
    :root{--sidebar:240px;--purple:#7a5cff;--bg:#f2f3f4;--ink:#1a1a1a;--muted:#999;--line:#dcdcdc}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-width:1180px;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:12px}button{font:inherit;cursor:pointer}.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.page{min-height:100vh;--sidebar:240px;position:relative;overflow:hidden;animation:pageIn .28s ease both}.page:before{content:"";position:fixed;z-index:0;left:var(--sidebar);right:0;top:0;height:470px;background:url("assets/bg-figma.png") center top/cover no-repeat;opacity:.28;filter:blur(2px);pointer-events:none}.page:after{content:"";position:fixed;z-index:0;left:var(--sidebar);right:0;top:26px;height:470px;background:linear-gradient(180deg,rgba(242,243,244,0) 0%,rgba(242,243,244,.68) 42%,#f2f3f4 91%);pointer-events:none}

.bean-card{position:absolute;left:12px;right:13px;bottom:24px;height:100px;padding:16px;border-radius:8px;background:url("assets/bean-bg.png") center/100% 100% no-repeat;overflow:hidden}.bean-card:after{content:"";position:absolute;left:16px;bottom:9px;width:182px;height:6px;border-radius:9px;background:linear-gradient(90deg,#ff2640 0 66%,transparent 66%),rgba(255,205,212,.58)}.bean-label{position:relative;z-index:1;color:#666;font-size:12px;line-height:17px}.bean-number{position:relative;z-index:1;margin-top:8px;font:500 22px/33px Arial;color:#1a1a1a}

}.report-type.selected{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(104deg,#ff7777,#ab9bfc) border-box;box-shadow:0 8px 26px rgba(122,92,255,.12)}.select-mark{position:absolute;right:24px;top:24px;width:20px;height:20px;border:1px solid #ccc;border-radius:4px;background:#fff;color:#fff;display:grid;place-items:center}.report-type.selected .select-mark{border:0;background:var(--purple)}.select-mark svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}.type-icon{width:68px;height:68px;margin-bottom:20px;border-radius:14px;background:#f9fafb;display:grid;place-items:center;color:var(--purple)}.type-icon svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.8}.report-type h2{margin:0 0 12px;font-size:20px;line-height:28px;font-weight:600}.report-type p{min-height:44px;margin:0 0 20px;color:#666;font-size:14px;line-height:22px}.type-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:auto}.type-tags span{height:24px;padding:3px 8px;border:1px solid rgba(51,51,51,.06);border-radius:4px;background:#f5f6f7;color:#333;font-size:12px;line-height:16px}.choose-link{display:flex;align-items:center;gap:8px;margin-top:24px;border:0;background:transparent;padding:0;color:var(--purple);font-size:14px;line-height:20px}.choose-link .icon{width:16px;height:16px;stroke-width:1.8}.toast{position:fixed;z-index:100;left:50%;bottom:32px;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;background:#333;color:#fff;box-shadow:0 9px 22px rgba(0,0,0,.16);opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .2s ease,transform .2s ease}.toast.show{opacity:1;transform:translate(-50%,0)}
    .page.collapsed{--sidebar:84px}.page.collapsed .sidebar{width:84px;overflow:visible;background:#f2f3f4;box-shadow:4px 0 12px rgba(97,85,255,.02)}.page.collapsed .brand{justify-content:center}.page.collapsed .brand>img{content:url("assets/brand-logo-collapsed.svg");width:44px;height:40px}.page.collapsed .collapse{left:0;right:auto;top:0;width:84px;height:64px;opacity:0}.page.collapsed .collapse.is-animating{opacity:1}.page.collapsed .nav{padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:24px}.page.collapsed .nav-group{width:50px;margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}.page.collapsed .nav-title{width:44px;padding:0;justify-content:center;font-size:0}.page.collapsed .nav-title:after{content:attr(data-short);font-size:14px}.page.collapsed .nav-link{width:50px;margin:0;padding:0;justify-content:center;gap:0}.page.collapsed .nav-link.active{width:50px;height:50px;border:1px solid #fff;border-radius:8px;background:rgba(255,255,255,.6)}.page.collapsed .nav-link.active:before{left:-1px;top:14px}.page.collapsed .nav-link span{display:none}.page.collapsed .nav-link:hover:after{display:flex}.page.collapsed .bean-card{left:7px;right:auto;width:70px;height:70px;padding:9px;border:1px solid #fff;border-radius:6px;background:linear-gradient(192deg,rgba(255,247,248,0) 75.926%,#ffdce1 96.708%),linear-gradient(90deg,rgba(255,240,242,.6),rgba(255,240,242,.6)),#fff}.page.collapsed .bean-card:after{display:none}.page.collapsed .bean-label{font-size:0}.page.collapsed .bean-label:before{content:"洞察豆";font-size:12px}.page.collapsed .bean-number{margin-top:0;font-size:0}.page.collapsed .bean-number:before{content:"2,580";font-size:22px}.page.collapsed .header,.page.collapsed .main{margin-left:84px}
    @keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes menuPulse{50%{transform:rotate(90deg) scale(.78)}100%{transform:rotate(180deg)}}@media(max-width:1400px){.create-panel{padding-top:clamp(100px,18.52vh,200px);padding-bottom:24px}.report-type{width:min(480px,calc((100% - 36px)/2))}}@media(max-width:1180px){body{min-width:0}.page{--sidebar:84px}.sidebar{width:84px}.brand{justify-content:center}.brand>img{content:url("assets/brand-logo-collapsed.svg");width:44px;height:40px}.collapse{inset:0;width:84px;height:64px;opacity:0}.nav{padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:24px}.nav-group{width:50px;margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}.nav-title{padding:0;justify-content:center;font-size:0}.nav-title:after{content:attr(data-short);font-size:14px}.nav-link{width:50px;margin:0;padding:0;justify-content:center;gap:0}.nav-link span,.bean-card{display:none}.nav-link:hover:after{display:flex}.header,.main{margin-left:84px}.create-panel{gap:20px;padding:72px 18px}.report-type{width:calc(50% - 10px)}}@media(max-width:720px){.steps{overflow:auto}.create-panel{height:auto;min-height:600px;padding:28px 16px;flex-direction:column;align-items:center}.report-type{width:min(480px,100%)}.header-tools{display:none}}
    /* Final design-state overrides for the 5321:13879 layout. */
    .report-type{border:1.5px solid #dbf0ff;background:#f7fcff}

    .report-type.periodic{border-color:#e6d9ff;background:#fdfcff}

    .type-icon{background:#dbf0ff;color:#0095ff}
    .report-type.special.selected .type-icon{background:#c8e6ff;color:#199fff}
    .report-type.periodic.selected .type-icon{background:#eee8ff;color:#7a5cff}

    .report-type.periodic.selected .choose-link{color:#7a5cff}
    .steps{width:100%;max-width:none;margin:26px 0 14px;padding:0 16px;align-items:center}
    .step{min-width:168px;padding:0;gap:12px}
    .step-line{min-width:80px;margin:0 32px;background:#d6d6d6}
    .report-type.special{border-color:#dbf0ff;background:#f7fcff}
    .report-type.periodic{border-color:#e6d9ff;background:#fdfcff}
    .report-type.special.selected{border-color:#0095ff!important;background-color:#f7fcff!important;background-image:url("assets/report-type-special-selected-bg.png")!important;background-repeat:no-repeat!important;background-position:center bottom!important;background-size:calc(100% + 18px) 155px!important;box-shadow:none}
    .report-type.periodic.selected{border-color:#7a5cff!important;background-color:#fdfcff!important;background-image:url("assets/report-type-periodic-selected-bg.png")!important;background-repeat:no-repeat!important;background-position:center bottom!important;background-size:calc(100% + 18px) 155px!important;box-shadow:0 4px 16px rgba(122,92,255,.16)}
    .report-type.special .type-icon{background:#dbf0ff;color:#0095ff}
    .report-type.periodic .type-icon{background:rgba(122,92,255,.1);color:#7a5cff}
    .report-type:not(.selected) .choose-link{color:#666}
    .nav{height:calc(100vh - 186px)}
    @media(min-width:1600px){.steps{padding:0}.step-line{margin:0 34px;min-width:120px}.create-panel{padding-top:200px}}
    @media(max-width:1400px){.steps{padding:0}.step{min-width:150px}.step-line{margin:0 18px;min-width:48px}}
    @media(max-width:900px){.steps{overflow:auto;padding-bottom:4px}.step-line{min-width:36px;margin:0 12px}}
    /* Figma 5321:15397 / 5321:15424: hover and selected share the same gradient state. */
    .report-type.special:is(:hover,.selected){border-color:#0095ff!important;background-color:#f7fcff!important;background-image:url("assets/report-type-special-selected-bg.png")!important;background-repeat:no-repeat!important;background-position:center bottom!important;background-size:calc(100% + 18px) 155px!important;box-shadow:0 8px 22px rgba(0,149,255,.08)!important;transform:none}

    .report-type.special:is(:hover,.selected) .type-icon{background:#c8e6ff;color:#199fff}
    .report-type.periodic:is(:hover,.selected) .type-icon{background:#eee8ff;color:#7a5cff}
    .report-type.special:is(:hover,.selected) .choose-link{color:#199fff}
    .report-type.periodic:is(:hover,.selected) .choose-link{color:#7a5cff}

<body>
  <div class="page">
    <aside class="sidebar">
      <div class="brand"><img src="assets/brand-logo-expanded.svg" alt="传播洞察"><button class="collapse" type="button" aria-label="折叠侧边栏"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div>
      <nav class="nav">
        <section class="nav-group"><div class="nav-title" data-short="监测">监测模块</div><button class="nav-link" data-label="监测项目列表"><img class="nav-icon" src="assets/report-nav-monitor.svg" alt=""><span>监测项目列表</span></button></section>
        <section class="nav-group"><div class="nav-title" data-short="报告">智能报告</div><button class="nav-link active" data-label="报告管理"><img class="nav-icon" src="assets/report-nav-report.svg" alt=""><span>报告管理</span></button><button class="nav-link" data-label="报告模板中心"><img class="nav-icon" src="assets/report-nav-template.svg" alt=""><span>报告模板中心</span></button></section>
        <section class="nav-group"><div class="nav-title" data-short="系统">系统管理</div><button class="nav-link" data-label="账号管理"><img class="nav-icon" src="assets/report-nav-account.svg" alt=""><span>账号管理</span></button><button class="nav-link" data-label="刷新记录日志"><img class="nav-icon" src="assets/report-nav-article.svg" alt=""><span>刷新记录日志</span></button><button class="nav-link" data-label="互动量刷新管理"><img class="nav-icon" src="assets/report-nav-reset.svg" alt=""><span>互动量刷新管理</span></button><button class="nav-link" data-label="分类设置"><img class="nav-icon" src="assets/report-nav-category.svg" alt=""><span>分类设置</span></button></section>
      </nav>
      <div class="bean-card"><div class="bean-label">洞察豆余额</div><div class="bean-number">32,580</div></div>
    </aside>
    <header class="header"><div class="crumbs"><span>智能报告</span><span>›</span><span>报告管理</span><span>›</span><b>新建报告</b></div><div class="header-tools"><button class="head-icon notice" aria-label="通知"><img src="assets/header-bell.svg" alt=""></button><button class="head-icon" aria-label="帮助"><img src="assets/header-help.svg" alt=""></button><div class="avatar"><img src="assets/header-avatar.png" alt=""></div></div></header>
    <main class="main">
      <div class="topline"><div class="title-wrap"><button class="return" type="button" data-href="report-management.html"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>返回</button><span class="title">新建报告</span></div><button class="save" type="button">保存草稿</button></div>
      <section class="steps" aria-label="创建步骤"><div class="step active"><b class="step-number">1</b><div><strong>选择报告类型</strong><span>专项/周期报告</span></div></div><i class="step-line"></i><div class="step"><b class="step-number">2</b><div><strong>填写基础信息</strong><span>设置名称时间</span></div></div><i class="step-line"></i><div class="step"><b class="step-number">3</b><div><strong>选择报告模板</strong><span>选择模板</span></div></div><i class="step-line"></i><div class="step"><b class="step-number">4</b><div><strong>确认数据源</strong><span>选定监测项目</span></div></div></section>
      <section class="create-panel">
        <button class="report-type special" type="button" data-type="专项报告"><span class="type-icon"><svg viewBox="0 0 24 24"><path d="M5 19V9m7 10V5m7 14v-7"/></svg></span><h2>专项报告</h2><p>针对性定主题，设置相对固定的单次分析报告。适合新车上市、热点公关、活动复盘等场景，灵活配置时间范围和分析维度。</p><div class="type-tags"><span>新车上市</span><span>舆情分析</span><span>竞品对标</span><span>活动复盘</span></div><span class="choose-link">选择此类型 <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></button>
        <button class="report-type periodic" type="button" data-type="周期报告"><span class="type-icon"><svg viewBox="0 0 24 24"><path d="M6 8h12M8 4v4m8-4v4M5 11h14v8H5z"/><path d="M9 15h2m2 0h2"/></svg></span><h2>周期报告</h2><p>按照固定周期自动生成的例行分析报告，适合品牌周报、月报、季度等常态化运营，持续追踪传播趋势。</p><div class="type-tags"><span>周报</span><span>月报</span><span>季报</span></div><span class="choose-link">选择此类型 <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></button>
      </section>
    </main>

  <script>
    const page=document.querySelector('.page');const routes={'监测项目列表':'index.html','报告管理':'report-management.html','报告模板中心':'template.html'};
    document.querySelectorAll('.nav-link').forEach(link=>link.addEventListener('click',()=>{const href=routes[link.dataset.label];if(href)location.href=href}));
    document.querySelectorAll('[data-href]').forEach(el=>el.addEventListener('click',()=>location.href=el.dataset.href));
    const collapse=document.querySelector('.collapse');collapse.addEventListener('click',()=>{page.classList.toggle('collapsed');collapse.classList.remove('is-animating');void collapse.offsetWidth;collapse.classList.add('is-animating')});collapse.addEventListener('animationend',()=>collapse.classList.remove('is-animating'));
    document.querySelectorAll('.report-type').forEach(card=>card.addEventListener('click',event=>{document.querySelectorAll('.report-type').forEach(item=>{item.classList.toggle('selected',item===card);item.setAttribute('aria-pressed',item===card?'true':'false')});if(!event.target.closest('.choose-link'))return;event.preventDefault();location.href='report-create-basic.html?type='+(card.dataset.type==='周期报告'?'periodic':'special')}));
  </script>
  <script src="nav-state.js"></script>
</body>
</html>
