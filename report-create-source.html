    const shortName=name=>name.length>10?name.slice(0,10)+'...':name;
    const visibleTagLimit=()=>innerWidth>=1500?5:4;
    function renderModules(){const limit=visibleTagLimit();list.innerHTML=modules.map((mod,index)=>{const selected=states[index],shown=selected.slice(0,limit),more=selected.length-shown.length;return `<article class="module-row"><div class="module-left"><span class="module-icon-box" style="--icon-bg:${mod.bg}"><img class="module-icon" src="${mod.icon}" alt=""></span><div class="module-copy"><div class="module-name">${mod.name}</div><div class="module-desc">${mod.desc}</div></div></div><div class="module-sources">${shown.map(id=>`<span class="source-tag" title="${projects[id].name}"><span class="tag-label">${shortName(projects[id].name)}</span><button class="tag-remove" data-module="${index}" data-source="${id}" aria-label="删除"></button></span>`).join('')}${more>0?`<span class="more-tag">+${more}</span>`:''}<button class="add-source" data-module="${index}" aria-label="为${mod.name}添加数据源"></button></div></article>`}).join('');updateProgress()}
    function updateProgress(){const configured=states.filter(items=>items.length).length;countEl.textContent=`${configured}/9 已配置`;bar.style.width=`${configured/9*100}%`}
    function projectCard(project,index){const selected=tempSelected.has(index);return `<button class="project-card ${selected?'selected':''}" data-project="${index}"><span class="check"></span><span class="project-main"><span class="project-title"><span>${project.name}</span><span class="running">运行中</span></span><span class="project-meta"><span class="project-type">${project.type}</span>${project.platforms.map(p=>`<span class="platform"><img src="${platformIcons[p]}" alt="">${p}</span>`).join('')}${project.more?`<span class="platform">+${project.more}</span>`:''}<span class="data-count">数据量&nbsp; 1,430</span></span></span></button>`}
    function renderProjects(){const query=document.querySelector('.project-search').value.trim(),type=document.querySelector('.type-filter').value;projectList.innerHTML=projects.map((project,index)=>({project,index})).filter(({project})=>(!query||project.name.includes(query))&&(!type||project.type===type)).map(({project,index})=>projectCard(project,index)).join('')}
    function openModal(mode,moduleIndex=-1){modalMode=mode;activeModule=moduleIndex;tempSelected=new Set(mode==='batch'?[0]:(states[moduleIndex].length?states[moduleIndex]:[0,1]));modalTitle.textContent=mode==='batch'?'批量设置数据源':`选择「${modules[moduleIndex].name}」数据源`;document.querySelector('.project-search').value='';document.querySelector('.type-filter').value='';document.querySelector('.status-filter').value='';renderProjects();mask.classList.add('show');mask.setAttribute('aria-hidden','false')}
    function closeModal(){mask.classList.remove('show');mask.setAttribute('aria-hidden','true')}
    projectList.addEventListener('click',event=>{const card=event.target.closest('.project-card');if(!card)return;const id=Number(card.dataset.project);tempSelected.has(id)?tempSelected.delete(id):tempSelected.add(id);renderProjects()});
    list.addEventListener('click',event=>{const remove=event.target.closest('.tag-remove');if(remove){const moduleIndex=Number(remove.dataset.module),source=Number(remove.dataset.source);states[moduleIndex]=states[moduleIndex].filter(id=>id!==source);renderModules();return}const add=event.target.closest('.add-source');if(add)openModal('single',Number(add.dataset.module))});
    document.querySelector('.batch-btn').addEventListener('click',()=>openModal('batch'));
    document.querySelector('.modal-close').addEventListener('click',closeModal);document.querySelector('.close-modal').addEventListener('click',closeModal);
    mask.addEventListener('click',event=>{if(event.target===mask)closeModal()});
    document.querySelector('.confirm-source').addEventListener('click',()=>{const value=[...tempSelected].sort((a,b)=>a-b);if(modalMode==='batch')states.forEach((_,index)=>states[index]=[...value]);else states[activeModule]=value;renderModules();closeModal();showToast(modalMode==='batch'?'已为9个分析模块同步配置数据源':'数据源配置已更新')});
    document.querySelector('.project-search').addEventListener('input',renderProjects);document.querySelector('.type-filter').addEventListener('change',renderProjects);
    document.querySelector('.reset-filter').addEventListener('click',()=>{document.querySelector('.project-search').value='';document.querySelector('.type-filter').value='';document.querySelector('.status-filter').value='';renderProjects()});document.querySelector('.apply-filter').addEventListener('click',renderProjects);
    document.querySelector('.generate').addEventListener('click',()=>{const left=states.filter(items=>!items.length).length;showToast(left?`还有${left}个分析模块未配置数据源`:'数据源配置完成，报告开始生成')});
    document.querySelector('.prev').addEventListener('click',()=>location.href=`report-create-template.html${location.search}`);document.querySelector('.back').addEventListener('click',()=>location.href='report-management.html');document.querySelector('.collapse').addEventListener('click',()=>document.querySelector('.page').classList.toggle('collapsed'));document.querySelectorAll('[data-href]').forEach(item=>item.addEventListener('click',()=>location.href=item.dataset.href));
    addEventListener('resize',renderModules);function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),1800)}
    renderModules();
  </script>
  <script src="nav-state.js"></script>
</body>
</html>
